name: Daily X post

# The daily post is triggered EXTERNALLY via workflow_dispatch, because
# GitHub's own cron proved unusable for a time-critical job: on 2026-09-25 it
# fired 187 and 227 minutes late, and on 2026-09-26 it did not fire at all.
# Dispatched runs, by contrast, started within ~30s every time.
#
# The one schedule below is therefore NOT the primary trigger. It is a late
# safety net that posts only if the day's post never went out, so an hours-late
# firing is harmless - which is the one thing GitHub cron is still good for.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no upload, no post, no credits spent)"
        type: boolean
        default: false
      check:
        description: "Verify credentials only (posts nothing)"
        type: boolean
        default: false
  schedule:
    # 20:00 UTC = 16:00 EDT / 15:00 EST, hours after the 11:11 target. Runs
    # with --catch-up: it checks the timeline first and exits quietly if the
    # post is already there. Even a 6-hour delay stays inside the same ET day.
    - cron: "0 20 * * *"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Post to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          START_DATE: ${{ vars.START_DATE }}
          TIMEZONE: America/New_York
          POST_AT: "11:11"
        run: |
          python post.py --verbose \
            ${{ github.event_name == 'schedule' && '--catch-up' || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }} \
            ${{ inputs.check && '--check' || '' }}
